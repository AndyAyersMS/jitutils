[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jitml"
version = "0.2.0"
description = "Reinforcement Learning environment for the .NET JIT's CSE heuristic"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Lee Culver" },
    { name = ".NET runtime contributors" },
]
keywords = ["reinforcement-learning", "jit", "cse", "dotnet", "gymnasium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=0.29,<2.0",
    "numpy>=1.24,<3.0",
    "pydantic>=2.5,<3.0",
    "pandas>=2.0",
    "stable-baselines3[extra]>=2.3,<3.0",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
tune = [
    "optuna>=3.4",
]
classify = [
    # For classification.py / notebooks/00_random_forest.ipynb
    "tensorflow>=2.15",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/dotnet/jitutils/tree/main/src/jit-rl-cse-py"
Upstream = "https://github.com/leculver/jitml"

[tool.setuptools.packages.find]
include = ["jitml*"]
exclude = ["tests*", "notebooks*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "*_test.py"

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
]

[tool.pylint.FORMAT]
max-line-length = 120
